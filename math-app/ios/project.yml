# XcodeGen spec. The .xcodeproj is generated from this (`xcodegen generate`), never edited by hand.
# The app is a thin native shell around the web app, so a web deploy updates the phone too.
name: Duth
options:
  bundleIdPrefix: com.slstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: DX4YLNP9RK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  Duth:
    type: application
    platform: iOS
    sources:
      - path: Duth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slstudio.duth
        PRODUCT_NAME: duth
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: duth
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPhone only; with iPad, Apple requires all four orientations for multitasking.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        # The chat mic, photo uploads of handwritten work.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 질문을 말로 입력할 때 마이크를 사용해요.
        INFOPLIST_KEY_NSCameraUsageDescription: 푼 흔적을 찍어서 교수님께 보여줄 때 카메라를 사용해요.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 푼 흔적 사진을 교수님께 보여줄 때 사진을 불러와요.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
